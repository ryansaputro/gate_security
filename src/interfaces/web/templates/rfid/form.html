{% extends "layout.html" %}
{% set active = "rfid" %}

{% block title %}{{ 'Edit' if card else 'Create' }} RFID Card{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">{{ 'Edit' if card else 'Create' }} RFID Card</h2>

  <form method="POST" class="bg-white rounded-lg shadow p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Card UID</label>
      <input type="text" name="card_uid" value="{{ card.card_uid if card else '' }}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono" required placeholder="A1B2C3D4">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Holder Name</label>
      <input type="text" name="holder_name" value="{{ card.holder_name if card else '' }}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Card Type</label>
      <select name="card_type" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="resident" {{ 'selected' if card and card.card_type == 'resident' else '' }}>Resident</option>
        <option value="temporary" {{ 'selected' if card and card.card_type == 'temporary' else '' }}>Temporary</option>
        <option value="master" {{ 'selected' if card and card.card_type == 'master' else '' }}>Master</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Family</label>
      <select name="family_id" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">-- No family --</option>
        {% for f in families %}
        <option value="{{ f._id }}" {{ 'selected' if card and (card.family_id|string) == (f._id|string) else '' }}>{{ f.head_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="inline-flex items-center gap-2">
        <input type="checkbox" name="is_active" value="true" {{ 'checked' if not card or card.is_active else '' }} class="rounded border-gray-300">
        <span class="text-sm font-medium text-gray-700">Active</span>
      </label>
    </div>

    <div class="flex gap-3 pt-4">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save</button>
      <a href="/admin/rfid" class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300">Cancel</a>
    </div>
  </form>

  {% if card %}
  <form method="POST" action="/admin/rfid/{{ card._id }}/delete" class="mt-4" onsubmit="return confirm('Delete this RFID card?')">
    <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Delete</button>
  </form>
  {% endif %}
</div>
{% endblock %}
