{% extends "layout.html" %}
{% set active = "houses" %}

{% block title %}{{ 'Edit' if house else 'Create' }} House{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">{{ 'Edit' if house else 'Create' }} House</h2>

  <form method="POST" class="bg-white rounded-lg shadow p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Block</label>
      <input type="text" name="block" value="{{ house.block if house else '' }}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Street</label>
      <input type="text" name="street" value="{{ house.street if house else '' }}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">House Number</label>
      <input type="text" name="house_number" value="{{ house.house_number if house else '' }}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
      <select name="status" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="vacant" {{ 'selected' if house and house.status == 'vacant' else '' }}>Vacant</option>
        <option value="occupied" {{ 'selected' if house and house.status == 'occupied' else '' }}>Occupied</option>
        <option value="rented" {{ 'selected' if house and house.status == 'rented' else '' }}>Rented</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Address Note</label>
      <textarea name="address_note" rows="3" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">{{ house.address_note if house else '' }}</textarea>
    </div>

    <div class="flex gap-3 pt-4">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save</button>
      <a href="/admin/houses" class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
